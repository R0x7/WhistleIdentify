name: Build Android APK

# Builds an installable APK on every commit to main and publishes it to the
# "android-latest" release, so the newest build always has the same download link.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME). Accept its
      # licenses so Gradle can download any platform/build-tools it needs.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Sign every build with the same debug key, so a new APK installs over the
      # previous one instead of Android refusing it as a different app.
      - name: Use the repo's debug signing key
        run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./scripts/build-android.sh

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: whistle-identify-${{ github.run_number }}
          path: build/whistle-identify.apk

      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest build/whistle-identify.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest Android build (1.0.${{ github.run_number }})" \
            --notes "Built automatically from ${GITHUB_SHA::7} on main. Download whistle-identify.apk on your phone and open it to install (allow installs from your browser if Android asks)."
